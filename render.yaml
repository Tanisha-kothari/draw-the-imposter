services:
  - type: web
    name: draw-the-imposter-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: draw-imposter-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://draw-the-imposter-9f4c2b9qq.vercel.app","http://localhost:5173"]'
      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: web
    name: draw-the-imposter-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://draw-the-imposter-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://draw-the-imposter-backend.onrender.com

databases:
  - name: draw-imposter-db
    plan: free
